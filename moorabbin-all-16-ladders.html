<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moorabbin Bowls Club — Pennant Ladders</title>
<style>
:root{--blue:#0057b8;--navy:#073b78;--pale:#eaf3ff;--line:#d6e0eb;--ink:#172b43;--muted:#60748b;--bg:#f3f6fa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
header{background:var(--blue);color:#fff;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(22px,3vw,34px);font-weight:900}.subtitle{font-size:14px;margin-top:4px;opacity:.92}
.header-right{display:flex;align-items:center;gap:12px;font-size:13px}.btn{border:1px solid #fff;background:#fff;color:var(--blue);font-weight:700;border-radius:6px;padding:9px 13px;cursor:pointer}
main{max-width:1600px;margin:0 auto;padding:18px}.status{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin:0 0 14px}.error{display:none;background:#fff1ef;border:1px solid #e5aaa4;color:#8e2018;padding:12px;border-radius:8px;margin-bottom:16px;white-space:pre-wrap}
.group{margin:0 0 28px}.group-title{font-size:22px;color:var(--blue);font-weight:900;border-bottom:3px solid var(--blue);padding:0 0 7px;margin:0 0 12px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.ladder-card{background:#fff;border:1px solid #cbd8e6;border-radius:9px;overflow:hidden;box-shadow:0 1px 3px #183b5b12;min-width:0}.card-head{background:var(--pale);padding:12px 14px;display:flex;justify-content:space-between;gap:8px;align-items:center}.card-head h3{font-size:18px;color:var(--navy);margin:0}.meta{font-size:12px;color:var(--muted);text-align:right}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}th{background:#f6f9fc;color:#536b84;text-align:right;padding:8px 7px;border-bottom:1px solid var(--line);font-size:11px;text-transform:uppercase}th:nth-child(2),td:nth-child(2){text-align:left}td{text-align:right;padding:8px 7px;border-bottom:1px solid #edf1f5}tbody tr:last-child td{border-bottom:0}tbody tr:nth-child(even){background:#fbfdff}tr.highlight{background:#eaf3ff!important;font-weight:800}td:nth-child(2){font-weight:600;max-width:260px;overflow:hidden;text-overflow:ellipsis}.notice{padding:18px;color:var(--muted);font-size:14px}.foot{text-align:center;color:var(--muted);font-size:12px;padding:8px 0 24px}
@media(max-width:850px){.cards{grid-template-columns:1fr}main{padding:12px}.card-head{padding:10px}}
</style></head><body>
<header><div><h1>MOORABBIN BOWLS CLUB</h1><div class="subtitle">Pennant ladders · All active sides · Live from BowlsLink</div></div><div class="header-right"><span id="updated">Loading…</span><button class="btn" id="refresh">Refresh now ↻</button></div></header>
<main><div class="status"><span id="status">Reading Pennant Links configuration…</span><span>Automatic refresh every 60 seconds</span></div><div id="error" class="error"></div><div id="content"></div><div class="foot">Ladder points and results sourced from BowlsLink · Moorabbin teams highlighted · Updated automatically every 60 seconds</div></main>
<script>
const API='https://api.bowlslink.com.au/results-api';
const CONFIG_CSV='https://docs.google.com/spreadsheets/d/e/2PACX-1vTR-Pnnpz-fVhZss-CL-n9EbRIuyBrxVyyzHGfvMN8aABznnqHwN7XdnvYVsYaqeg/pub?gid=1080033371&single=true&output=csv';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm=s=>String(s??'').trim().toLowerCase().replace(/\s+/g,' ');
function csvRows(text){const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'&&q&&text[i+1]==='"'){cell+='"';i++;}else if(c==='"')q=!q;else if(c===','&&!q){row.push(cell);cell='';}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v.trim()))rows.push(row);row=[];cell='';}else cell+=c;}row.push(cell);if(row.some(v=>v.trim()))rows.push(row);return rows;}
function val(o,names){for(const n of names){const k=Object.keys(o).find(x=>norm(x)===norm(n));if(k!==undefined)return String(o[k]??'').trim();}return '';}
function active(v){return ['yes','true','1','active','y'].includes(norm(v));}
function groupName(v){let x=norm(v);if(x.includes('saturday'))return 'Saturday Pennant';if(x.includes('tuesday'))return 'Tuesday Night';if(x.includes('thursday'))return 'Thursday Pennant';if(x.includes('midweek'))return 'Midweek Pennant';return v||'Other Pennant';}
async function loadConfig(){const r=await fetch(CONFIG_CSV+'&_='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Google Sheet returned HTTP '+r.status);const rows=csvRows(await r.text());if(rows.length<2)throw Error('The published Google Sheet is empty.');const headers=rows[0].map(x=>x.replace(/^\uFEFF/,'').trim());return rows.slice(1).map(row=>Object.fromEntries(headers.map((h,i)=>[h,row[i]??'']))).filter(x=>active(val(x,['Active']))).map(x=>{const side=val(x,['Moorabbin Team','Team','Team Name']);const id=val(x,['BowlsLink Competition ID','Competition ID','Bowlslink Competition ID']);const comp=val(x,['Competition','Competition Type']);const sectionRaw=val(x,['Section / Pool','Section','Pool']);const section=sectionRaw===''?null:(Number.isFinite(Number(sectionRaw))?Number(sectionRaw):sectionRaw);const orderRaw=val(x,['Display Order','Order','Sort Order']);return {side,id,group:groupName(comp),section,order:Number(orderRaw)||999,url:val(x,['BowlsLink URL','URL'])};}).filter(x=>x.side&&x.id).sort((a,b)=>a.order-b.order||a.group.localeCompare(b.group)||a.side.localeCompare(b.side));}
async function get(path){const r=await fetch(API+path+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status+' '+r.statusText);return r.json();}
function includes(p,t){return (p.include||[]).filter(x=>x.type===t)}function attrMap(p,t){const o={};includes(p,t).forEach(x=>o[x.id]=x.attributes||{});return o;}
function parseCompetition(p,forcedPool=null){const competitors=attrMap(p,'competitor'),results=attrMap(p,'multiFormatResult'),matches=includes(p,'match');let pool=forcedPool;if(pool===null){const moorId=Object.keys(competitors).find(id=>/moorabbin/i.test(competitors[id].name||''));if(moorId){const mm=matches.find(m=>m.includes?.competitorOne?.id===moorId||m.includes?.competitorTwo?.id===moorId);pool=mm?.attributes?.pool??null;}}
 const rows=pool===null?matches:matches.filter(m=>String(m.attributes?.pool)===String(pool)&&!m.attributes?.isFinalsSeries);const allMatches=[];for(const m of rows){const c1=m.includes?.competitorOne?.id,c2=m.includes?.competitorTwo?.id;if(!c1||!c2)continue;const rid=m.includes?.result?.id,r=rid?results[rid]:null;const completed=!!r?.isCompleted;const s1=completed?Number(r.competitorOneScore??0):null,s2=completed?Number(r.competitorTwoScore??0):null;allMatches.push({id:m.id,round:m.attributes?.round??0,state:m.attributes?.matchState||'',n1:competitors[c1]?.name||'Unknown',n2:competitors[c2]?.name||'Unknown',s1,s2,p1:completed?Number(r.competitorOnePoints??0):0,p2:completed?Number(r.competitorTwoPoints??0):0,resultStatus:r?.status||'',winner:completed?(s1>s2?c1:s2>s1?c2:(r?.winnerId===c1?c1:r?.winnerId===c2?c2:null)):null,c1,c2,completed});}
 return {competitors,allMatches,pool};}
async function computeLadder(p){const stats={};const ensure=id=>stats[id]??={played:0,wins:0,losses:0,draws:0,score:0,against:0,points:0};for(const m of p.allMatches){if(!m.completed||String(m.state).toUpperCase()!=='PLAYED')continue;const a=ensure(m.c1),b=ensure(m.c2);a.played++;b.played++;a.score+=Number(m.s1||0);a.against+=Number(m.s2||0);b.score+=Number(m.s2||0);b.against+=Number(m.s1||0);
 // BowlsLink supplies the awarded match points, including rink points and forfeits.
 a.points+=Number(m.p1||0);b.points+=Number(m.p2||0);if(m.winner===m.c1){a.wins++;b.losses++;}else if(m.winner===m.c2){b.wins++;a.losses++;}else{a.draws++;b.draws++;}}
 return Object.entries(stats).map(([id,s])=>({id,name:p.competitors[id]?.name||'Unknown',...s,diff:s.score-s.against})).sort((a,b)=>b.points-a.points||b.diff-a.diff||b.score-a.score).map((x,i)=>({...x,pos:i+1}));}
function cardHtml(cfg,ladder,error){const meta=cfg.section===null?'Section auto-detected':`Section ${cfg.section}`;if(error)return `<article class="ladder-card"><div class="card-head"><h3>${esc(cfg.side)}</h3><div class="meta">${esc(cfg.group)} · ${meta}</div></div><div class="notice">Unable to load this competition from BowlsLink. It will be retried automatically.</div></article>`;const body=ladder.length?`<div class="table-wrap"><table><thead><tr><th>Pos</th><th>Club</th><th>P</th><th>W</th><th>L</th><th>D</th><th>For</th><th>Agst</th><th>Diff</th><th>Pts</th></tr></thead><tbody>${ladder.map(x=>`<tr class="${/moorabbin/i.test(x.name)?'highlight':''}"><td>${x.pos}</td><td title="${esc(x.name)}">${esc(x.name)}</td><td>${x.played}</td><td>${x.wins}</td><td>${x.losses}</td><td>${x.draws}</td><td>${x.score}</td><td>${x.against}</td><td>${x.diff>0?'+':''}${x.diff}</td><td>${x.points}</td></tr>`).join('')}</tbody></table></div>`:'<div class="notice">No completed matches recorded yet for this section.</div>';return `<article class="ladder-card"><div class="card-head"><h3>${esc(cfg.side)}</h3><div class="meta">${esc(cfg.group)} · ${meta}</div></div>${body}</article>`;}
async function refresh(){const status=document.getElementById('status'),error=document.getElementById('error'),host=document.getElementById('content');status.textContent='Reading Pennant Links configuration…';error.style.display='none';try{const cfgs=await loadConfig();if(!cfgs.length)throw Error('No active teams found. Check the Active column in the Pennant Links sheet.');status.textContent=`Loading ladders for ${cfgs.length} active sides…`;const results=await Promise.all(cfgs.map(async c=>{try{const raw=await get('/competition/'+encodeURIComponent(c.id)+'/matches');const parsed=parseCompetition(raw,c.section);return {c,ladder:await computeLadder(parsed)};}catch(e){console.error(c.side,e);return {c,error:e};}}));const groups=[...new Set(results.map(x=>x.c.group))];host.innerHTML=groups.map(g=>`<section class="group"><h2 class="group-title">${esc(g)} Ladders</h2><div class="cards">${results.filter(x=>x.c.group===g).map(x=>cardHtml(x.c,x.ladder,x.error)).join('')}</div></section>`).join('');const failed=results.filter(x=>x.error).length;status.textContent=`${results.length-failed} of ${results.length} ladders loaded${failed?` · ${failed} will retry`:''}`;document.getElementById('updated').textContent='Last updated '+new Date().toLocaleTimeString('en-AU');}catch(e){status.textContent='Unable to load ladders';error.style.display='block';error.textContent=e.message;}}
document.getElementById('refresh').addEventListener('click',refresh);refresh();setInterval(refresh,60000);
</script></body></html>
